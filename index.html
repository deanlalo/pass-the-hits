<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hit or Miss">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#23252f">
<title>Hit or Miss</title>
<style>
/* Layout: one-screen phone app in the iOS idiom. Background = current player's colour with a soft top glow.
   Frosted glass surfaces, white cards, large-title type, frosted sticky action bar. Timeline newest on top. */
:root{padding-top:env(safe-area-inset-top,0px);
  --bg:#23252f;                        /* set per player from JS */
  --deep:color-mix(in srgb,var(--bg) 60%,#000);
  --glass:rgba(255,255,255,.14); --glass-2:rgba(255,255,255,.22); --hair:rgba(255,255,255,.2);
  --paper:#ffffff; --ink:#1d1d1f; --ink-soft:#6e6e73; --fg:#ffffff; --fg-soft:rgba(255,255,255,.74);
  --coin:#ffd60a; --good:#25a55f; --bad:#ff453a;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --gut:max(20px,env(safe-area-inset-left,0px));
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background-color:var(--bg);background-image:radial-gradient(130% 55% at 50% -12%,rgba(255,255,255,.24),rgba(255,255,255,0) 62%);background-repeat:no-repeat;color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;letter-spacing:-.01em;transition:background-color .5s ease;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding-left:var(--gut);padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.app>*{flex-shrink:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg-soft)}
.sub{color:var(--fg-soft);font-size:16px;margin:0;max-width:32ch}
.coin{display:inline-block;width:.78em;height:.78em;border-radius:50%;background:var(--coin);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18);vertical-align:-.04em;flex:0 0 auto}
.glassy{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%)}

/* buttons */
.btn{border-radius:999px;padding:0 22px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;min-height:52px;background:var(--paper);color:var(--ink);text-align:center;line-height:1.2;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--glass);color:var(--fg)}
.btn.small{min-height:40px;padding:0 16px;font-size:15px;font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.wide{width:100%}
.linkish{color:var(--fg-soft);padding:10px;font-size:15px;align-self:center;text-decoration:none}

/* frosted sticky action bar */
.bar{margin-top:auto;padding-top:2px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:stretch;gap:4px}
.cta{width:100%;min-height:60px;border-radius:999px;background:var(--paper);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 8px 0 26px;font-size:18px;font-weight:700;letter-spacing:-.015em;box-shadow:0 14px 34px -14px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.6) inset;transition:transform .12s ease,background .25s,color .25s,box-shadow .25s}
.cta:active{transform:scale(.98)}
.cta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.cta .ctaIcon{flex:0 0 44px;height:44px;border-radius:50%;background:var(--bg);color:#fff;display:grid;place-items:center;transition:background .25s}
.cta .ctaIcon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cta .ctaIcon svg.fill{fill:currentColor;stroke:none}
.cta:disabled{background:var(--glass);color:var(--fg-soft);box-shadow:none;cursor:not-allowed;transform:none}
.cta:disabled .ctaIcon{background:var(--glass)}
.cta.ready{animation:nudge 2.4s ease-in-out 1}
@keyframes nudge{0%,100%{box-shadow:0 14px 34px -14px rgba(0,0,0,.55),0 0 0 0 rgba(255,255,255,.5)}40%{box-shadow:0 14px 34px -14px rgba(0,0,0,.55),0 0 0 8px rgba(255,255,255,0)}}
.topBtns{display:flex;gap:6px;flex:0 0 auto}
.quitBtn{flex:0 0 auto;height:36px;min-width:36px;border-radius:999px;background:var(--glass);font-size:15px;font-weight:600;padding:0 12px;transition:background .2s}
.quitBtn.armed{background:var(--bad);color:#fff}
.bar .why{font-size:13px;color:var(--fg-soft);text-align:center}

/* header */
.top{display:flex;gap:10px;align-items:center}
.board{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:1px}
.board::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--glass);border-radius:14px;padding:7px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:7px;row-gap:1px;align-items:center;min-width:88px;transition:background .3s}
.chip.on{background:var(--paper);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.95)}
.chip .n{font-weight:600;font-size:14px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.chip .s{grid-column:1 / -1;display:flex;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.7;white-space:nowrap}
.chip .s span{display:inline-flex;align-items:center;gap:4px}
.help{flex:0 0 36px;height:36px;border-radius:50%;background:var(--glass);font-weight:600;font-size:17px}

/* turn head */
.turnHead{display:flex;flex-direction:column;gap:4px}
.stepbar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
.stepbar i{height:3px;border-radius:3px;background:var(--glass-2);transition:background .3s}
.stepbar i.on{background:var(--paper)}
h1,h2,.display{font-weight:700;letter-spacing:-.025em}
h1{font-size:40px;line-height:1.02;margin:0}
h2{font-size:28px;line-height:1.1;margin:0;overflow-wrap:anywhere}
.instr{font-size:16px;line-height:1.4;margin:0;color:var(--fg-soft);max-width:30ch}

/* record */
.record{border-radius:26px;padding:20px 16px 14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.playBtn{flex:0 0 auto;width:88px;height:88px;border-radius:50%;background:var(--paper);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,255,255,.12),0 16px 36px -14px rgba(0,0,0,.55);transition:transform .15s ease,box-shadow .3s ease}
.playBtn:active{transform:scale(.94)}
.playBtn svg{width:34px;height:34px;fill:currentColor}
.playBtn[aria-label="Pause"]{box-shadow:0 0 0 14px rgba(255,255,255,.16),0 16px 36px -14px rgba(0,0,0,.55)}
.playBtn:disabled{background:var(--glass-2);color:var(--fg-soft);box-shadow:none;cursor:default}
.record .status{font-size:15px;color:var(--fg-soft);display:flex;align-items:center;justify-content:center;gap:8px;min-height:21px}
.mdot{display:block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,var(--bg) 15% 100%)}
.eq{display:inline-flex;gap:2.5px;align-items:flex-end;height:13px}
.eq i{width:3px;background:var(--fg);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
.songT{font-weight:600;font-size:17px;line-height:1.25;unicode-bidi:plaintext;overflow-wrap:anywhere}
.songA{font-size:15px;color:var(--fg-soft);unicode-bidi:plaintext;overflow-wrap:anywhere}
.songT,.songA{text-align:left}
.tools,.fallback{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* timeline */
.tlWrap{flex:1 1 auto!important;min-height:110px;display:flex;flex-direction:column;gap:8px}
.tlHead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.timeline{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:4px 0 14px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 22px),transparent)}
.timeline::-webkit-scrollbar{display:none}
.timeline>*{flex-shrink:0}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:13px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 28px -20px rgba(0,0,0,.6)}
.card .y{flex:0 0 auto;font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:2.9em}
.card .t{flex:1;min-width:0}
.card .songT{font-size:16px}
.card .songA{font-size:14px;color:var(--ink-soft)}
.card.mystery{box-shadow:inset 0 0 0 2px var(--bg),0 10px 28px -20px rgba(0,0,0,.6)}
.card.mystery .y,.card.mystery .songA{color:var(--bg)}
.card.mystery .songA{font-weight:600}
.card.placed{box-shadow:inset 0 0 0 2px var(--good),0 10px 28px -20px rgba(0,0,0,.6)}
.card.placed .y{color:var(--good)}
.pill{flex:0 0 auto;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--good);color:#fff;white-space:nowrap}
.gap{width:100%;min-height:44px;border-radius:14px;background:var(--glass);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;padding:6px 12px;text-align:center;transition:background .2s}
button.gap:hover{background:var(--glass-2)}
.gap .plus{width:20px;height:20px;border-radius:50%;background:var(--paper);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;flex:0 0 auto}
.gap.quiet{min-height:0;height:1px;padding:0;background:var(--hair);margin:3px 28px}
.tag{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--glass);font-size:15px;font-weight:500}
.tag .mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
.tag .mark.ok{background:var(--good)}.tag .mark.no{background:var(--bad)}.tag .mark.wait{background:var(--paper);color:var(--ink)}
.tag span:last-child{min-width:0;overflow-wrap:anywhere}

/* steal */
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{background:var(--glass);border-radius:999px;padding:0 16px 0 13px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.who button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.who button:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:15px;color:var(--fg-soft);margin:0;max-width:36ch}

/* result */
.result{background:var(--paper);color:var(--ink);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px -24px rgba(0,0,0,.6)}
.result .verdict{display:flex;align-items:center;gap:12px}
.result .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff;flex:0 0 auto}
.result .badge.ok{background:var(--good)}.result .badge.no{background:var(--bad)}.result .badge.st{background:var(--ink)}
.result .verdict b{font-weight:700;font-size:22px;line-height:1.1;letter-spacing:-.02em;display:block}
.result .verdict span{font-size:15px;color:var(--ink-soft)}
.result .song{display:flex;gap:14px;align-items:center;padding-top:12px;border-top:.5px solid #d9d9de}
.result .song .y{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.035em;color:var(--bg);flex:0 0 auto;font-variant-numeric:tabular-nums}
.result .song .songA{color:var(--ink-soft)}
.result .song>div{min-width:0}
.ask{display:flex;flex-direction:column;gap:8px}
.inlineLink{display:inline-block;margin-top:3px;font-size:13.5px;font-weight:600;color:var(--bg);text-decoration:none}
.ask p{margin:0;font-size:15px;color:var(--fg-soft)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{min-height:46px;border-radius:999px;background:var(--glass);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.choice button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* setup */
.setupHero{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.heroTop{display:flex;justify-content:space-between;align-items:center}
.grow{flex:1 1 auto!important;min-height:0}
.section.grow{display:flex;flex-direction:column}
.scrolly{overflow-y:auto;min-height:0;overscroll-behavior:contain}
.stepCtl{display:flex;align-items:center;gap:12px}
.vinyls{display:flex}
.vinyls i{width:30px;height:30px;border-radius:50%;margin-right:-8px;background:radial-gradient(circle,#fff 0 13%,var(--c) 14% 100%);box-shadow:0 0 0 2.5px var(--bg)}
.section{display:flex;flex-direction:column;gap:10px}
.group{background:var(--glass);border-radius:20px;padding:6px;display:flex;flex-direction:column}
.group .nameRow+.nameRow{border-top:.5px solid var(--hair)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--glass);padding:3px;border-radius:14px}
.seg button{padding:9px 4px;border-radius:11px;font-weight:600;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .2s}
.seg button small{font-weight:400;font-size:12px;opacity:.7}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 3px 10px -4px rgba(0,0,0,.4)}
.nameRow{display:flex;gap:10px;align-items:center;padding:6px 6px 6px 8px}
.swatch{flex:0 0 30px;height:30px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.nameRow input{flex:1;min-width:0;background:transparent;color:var(--fg);border:0;padding:0 4px;height:40px;font:inherit;font-size:17px}
.nameRow input:focus{outline:none}
.nameRow input::placeholder{color:var(--fg-soft)}
.iconBtn{flex:0 0 32px;height:32px;border-radius:50%;background:var(--glass);font-size:18px;line-height:1}
.iconBtn:disabled{opacity:.25}
.addRow{padding:12px 10px;color:var(--fg);font-weight:500;text-align:left;border-top:.5px solid var(--hair)}

/* pass + win */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding-block:28px}
.bigName{font-weight:700;font-size:clamp(52px,16vw,84px);line-height:1;letter-spacing:-.04em;overflow-wrap:anywhere;max-width:100%}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.stats span{background:var(--glass);border-radius:999px;padding:7px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.stats b{font-variant-numeric:tabular-nums;font-weight:600}
.disc{width:150px;height:150px;border-radius:50%;margin-bottom:10px;background:radial-gradient(circle,var(--paper) 0 5%,var(--bg) 5.5% 18%,transparent 18.5%),repeating-radial-gradient(circle,#1d1e26 0 1.5px,#121318 1.5px 3px);box-shadow:0 30px 60px -28px rgba(0,0,0,.7)}
.disc.small{width:96px;height:96px;margin:0 0 4px}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* rules sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .inner{background:var(--paper);color:var(--ink);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:26px max(22px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-weight:700;font-size:28px;letter-spacing:-.025em;margin:0}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:16px;color:#3a3a3c}
.sheet .tokRules{background:#f2f2f7;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px;color:#3a3a3c}
.sheet .tokRules b{display:flex;align-items:center;gap:6px;color:var(--ink)}
.sheet .btn{background:var(--ink);color:#fff}
@media (max-height:760px){
  .app{gap:10px}
  h2{font-size:24px}
  .instr{font-size:15px}
  .record{flex-direction:row;padding:12px 16px;gap:14px;text-align:left;border-radius:22px}
  .record .status{justify-content:flex-start}
  .playBtn{width:62px;height:62px;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 10px 24px -12px rgba(0,0,0,.55)}
  .playBtn[aria-label="Pause"]{box-shadow:0 0 0 9px rgba(255,255,255,.16),0 10px 24px -12px rgba(0,0,0,.55)}
  .playBtn svg{width:26px;height:26px}
  .btn.small{min-height:36px;font-size:14px}
  .btn{min-height:48px}
  .cta{min-height:54px;font-size:17px}
  .cta .ctaIcon{flex-basis:40px;height:40px}
  .result{padding:14px;gap:10px}
  .result .song{padding-top:10px}
  .choice button{min-height:42px}
}
@media (prefers-reduced-motion:reduce){.spin,.eq i{animation:none}body{transition:none}}
</style>
</head>

const SONGS = [...GLOBAL.map(s=>({t:s[0],a:s[1],y:s[2],p:"g"})), ...ISRAELI.map(s=>({t:s[0],a:s[1],y:s[2],p:"i"}))];

const COLORS=["#2f5be6","#e2473d","#1d8f5a","#7b4fe0","#d23d7d","#118499","#cf6410","#3b3f52"];

// ---------- State ----------
const KEY="passthehits.v3";
let S = load() || freshSetup();
function freshSetup(){return {screen:"setup",roster:[{name:"Dean",c:0},{name:"Noa",c:1}],pack:"m",target:10}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const song=i=>SONGS[i];
const sortTL=tl=>tl.sort((a,b)=>song(a).y-song(b).y);
const inPack=i=>S.pack==="m"||song(i).p===S.pack;
const keep=()=>({roster:S.roster,pack:S.pack,target:S.target});

function startGame(){
  const roster=S.roster.map(r=>({...r,name:r.name.trim()})).filter(r=>r.name);
  if(roster.length<2) return;
  const deck=shuffle(SONGS.map((_,i)=>i).filter(inPack));
  const players=roster.map(r=>({name:r.name,c:r.c,cards:[deck.pop()],tokens:2}));
  S={...keep(),screen:"game",players,deck,turn:0,phase:"pass",current:deck.pop(),pick:null,challenges:[],pickingFor:null,result:null,played:false};
  save();render();
}
function drawNext(){
  if(!S.deck.length){
    const used=new Set(S.players.flatMap(p=>p.cards)); used.add(S.current);
    S.deck=shuffle(SONGS.map((_,i)=>i).filter(i=>!used.has(i)&&inPack(i)));
  }
  S.current=S.deck.pop();
}
function slotOK(tl,k,y){
  const prev=k>0?song(tl[k-1]).y:-Infinity, next=k<tl.length?song(tl[k]).y:Infinity;
  return prev<=y&&y<=next;
}
const anyStealers=()=>S.players.some((p,i)=>i!==S.turn&&p.tokens>0);

function startTurn(){S.phase="listen";save();render();scrollTo(0,0)}
function lockIn(){if(S.pick===null)return; if(anyStealers()){S.phase="steal";save();render();scrollTo(0,0)} else reveal()}
function reveal(){
  stopAudio();
  const P=S.players[S.turn], y=song(S.current).y;
  const okActive=slotOK(P.cards,S.pick,y);
  let winner=null;
  if(okActive) winner=S.turn;
  else for(const c of S.challenges){if(slotOK(P.cards,c.slot,y)){winner=c.p;break}}
  S.result={winner,okActive,named:null,before:[...P.cards]};
  if(winner!==null){S.players[winner].cards.push(S.current);sortTL(S.players[winner].cards)}
  S.phase="reveal";save();render();scrollTo(0,0);
}
function nextTurn(){
  stopAudio();
  if(S.result&&S.result.named){const P=S.players[S.turn];P.tokens=Math.min(5,P.tokens+1)}
  const w=S.players.find(p=>p.cards.length>=S.target);
  if(w){S.screen="win";S.winner=S.players.indexOf(w);save();render();return}
  S.turn=(S.turn+1)%S.players.length; drawNext();
  Object.assign(S,{phase:"pass",pick:null,challenges:[],pickingFor:null,result:null,played:false});
  save();render();scrollTo(0,0);
}
function newSong(cost){const P=S.players[S.turn];if(P.tokens<cost)return;P.tokens-=cost;stopAudio();drawNext();S.pick=null;S.played=false;save();render()}
function buyCard(){
  const P=S.players[S.turn];if(P.tokens<3)return;P.tokens-=3;stopAudio();
  S.result={winner:S.turn,okActive:true,bought:true,named:false,before:[...P.cards]};
  P.cards.push(S.current);sortTL(P.cards);S.phase="reveal";save();render();scrollTo(0,0);
}
function tapGap(k){
  if(S.phase==="listen"){S.pick=k;save();render();return}
  if(S.phase==="steal"&&S.pickingFor!==null){
    if(k===S.pick||S.challenges.some(c=>c.slot===k))return;
    S.players[S.pickingFor].tokens--; S.challenges.push({p:S.pickingFor,slot:k}); S.pickingFor=null; save();render();
  }
}
function toggleStealer(i){
  const c=S.challenges.find(x=>x.p===i);
  if(c){S.challenges=S.challenges.filter(x=>x.p!==i);S.players[i].tokens++;S.pickingFor=null}
  else S.pickingFor = S.pickingFor===i?null:i;
  save();render();
}

function jsonp(url){return new Promise((res,rej)=>{const cb="cb"+Math.random().toString(36).slice(2);const s=document.createElement("script");
  const t=setTimeout(()=>{done();rej("timeout")},7000);function done(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}
  window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej("error")};s.src=url+"&callback="+cb;document.head.appendChild(s)})}
const norm=x=>String(x||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim();
function pickHit(hits,s){
  hits=hits.filter(h=>h.url);
  const a=norm(s.a).split(" ")[0], t=norm(s.t).split(" ")[0];
  return hits.find(h=>norm(h.artist).includes(a)&&norm(h.title).includes(t))||hits.find(h=>norm(h.artist).includes(a))||hits[0]||null;
}
async function findPreview(i){
  if(i in previewCache) return previewCache[i];
  const s=song(i), q=s.t+" "+s.a;
  try{const d=await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=10&country=${s.p==="i"?"IL":"US"}`);
    const r=pickHit((d.results||[]).map(x=>({url:x.previewUrl,artist:x.artistName,title:x.trackName})),s);if(r) return previewCache[i]=r.url}catch(e){}
  try{const d=await jsonp(`https://api.deezer.com/search?q=${encodeURIComponent(q)}&output=jsonp`);
    const r=pickHit((d.data||[]).map(x=>({url:x.preview,artist:x.artist&&x.artist.name,title:x.title})),s);if(r) return previewCache[i]=r.url}catch(e){}
  return previewCache[i]=null;
}
async function prepare(i){
  if(audioFor===i && audioState!=="idle") return;
  stopAudio(); audioFor=i; audioState="loading"; refreshPlay();
  const url=await findPreview(i);
  if(audioFor!==i) return;
  if(!url){audioState="missing";refreshPlay();return}
  audio.src=url; audioState="ready"; refreshPlay();
}
function stopAudio(){try{audio.pause()}catch(e){} audioState="idle"; audioFor=null}
function togglePlay(){
  if(audioState==="playing"){audio.pause();audioState="ready";refreshPlay();return}
  if(audioState==="ready"){const p=audio.play();audioState="playing";const first=!S.played;S.played=true;save();
    if(first) render(); else refreshPlay();
    p&&p.catch(()=>{audioState="ready";refreshPlay()})}
}
audio.addEventListener("ended",()=>{audioState="ready";refreshPlay()});
audio.addEventListener("error",()=>{if(audioFor!==null){previewCache[audioFor]=null;audioState="missing";refreshPlay()}});
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>';
function refreshPlay(){
  const b=document.getElementById("play"); if(!b) return;
  const st=document.getElementById("pstatus"), fb=document.getElementById("fallback");
  const playing=audioState==="playing";
  b.innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  b.setAttribute("aria-label",playing?"Pause":"Play song");
  b.disabled=!(audioState==="ready"||playing);
  fb&&(fb.hidden=audioState!=="missing");
  if(st) st.innerHTML = playing ? '<span class="eq"><i></i><i></i><i></i><i></i></span>Playing a 30-second clip'
    : ({idle:"Loading the song…",loading:"Loading the song…",ready:S.played?"Tap to hear it again":"Tap play to listen",missing:"No clip found for this song"}[audioState]);
}

// ---------- Render helpers ----------
let tlScroll=0, tlKey="";
const CTA_ICON={arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',play:'<svg class="fill" viewBox="0 0 24 24"><path d="M8 5.5v13c0 .8.9 1.3 1.6.9l10-6.5c.6-.4.6-1.4 0-1.8l-10-6.5C8.9 4.2 8 4.7 8 5.5z"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',again:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>'};
const cta=(id,label,icon="arrow",disabled=false,ready=false)=>`<button class="cta${ready&&!disabled?" ready":""}" id="${id}" ${disabled?"disabled":""}><span dir="auto">${label}</span><i class="ctaIcon">${CTA_ICON[icon]}</i></button>`;
const app=document.getElementById("app"), sheet=document.getElementById("sheet");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const spotifyURL=i=>"https://open.spotify.com/search/"+encodeURIComponent(song(i).t+" "+song(i).a);
const $=id=>document.getElementById(id);
const setBg=hex=>{document.documentElement.style.setProperty("--bg",hex);const m=document.querySelector('meta[name="theme-color"]');m&&m.setAttribute("content",hex)};

function gapLabel(tl,k){
  if(!tl.length) return "Anywhere";
  const prev=k>0?song(tl[k-1]).y:null, next=k<tl.length?song(tl[k]).y:null;
  if(prev===null) return `Before ${next}`;
  if(next===null) return `After ${prev}`;
  if(prev===next) return `Also ${prev}`;
  return `${prev} – ${next}`;
}
function cardHTML(i,cls=""){const s=song(i);return `<div class="card ${cls}"><span class="y">${s.y}</span><span class="t"><div class="songT" dir="auto">${esc(s.t)}</div><div class="songA" dir="auto">${esc(s.a)}</div></span>${cls.includes("placed")?'<span class="pill">Here</span>':""}</div>`}
function mysteryCardHTML(label){return `<div class="card mystery"><span class="y"><i class="mdot"></i></span><span class="t"><div class="songT">Mystery song</div><div class="songA" dir="auto">${esc(label)}</div></span></div>`}
function tagHTML(state,text){const m={ok:"✓",no:"✕",wait:"•"}[state];return `<div class="tag"><span class="mark ${state}">${m}</span><span dir="auto">${text}</span></div>`}

function boardHTML(){
  return `<header class="top"><div class="board">${S.players.map((p,i)=>`<div class="chip ${i===S.turn&&S.screen==="game"?"on":""}">
    <span class="dot" style="background:${COLORS[p.c]}"></span><span class="n" dir="auto">${esc(p.name)}</span>
    <span class="s"><span>${p.cards.length}/${S.target}</span><span><i class="coin"></i>${p.tokens}</span></span></div>`).join("")}</div>
    <div class="topBtns">${S.screen==="game"?'<button class="quitBtn" id="quit">End</button>':""}<button class="help" id="help" aria-label="How to play">?</button></div></header>`;
}
function turnHeadHTML(P,instr){
  const idx={listen:0,steal:1,reveal:2}[S.phase];
  const names=["Listen & place","Steal","Reveal"];
  return `<div class="turnHead">
    <div class="stepbar">${[0,1,2].map(i=>`<i class="${i<=idx?"on":""}"></i>`).join("")}</div>
    <span class="eyebrow">Step ${idx+1} of 3 · ${names[idx]}</span>
    <h2 dir="auto">${esc(P.name)}'s turn</h2>
    ${instr?`<p class="instr">${instr}</p>`:""}</div>`;
}

// ---------- Screens ----------
function render(){
  if(S.screen==="setup"){setBg(HOME_BG);return renderSetup()}
  if(S.screen==="win"){setBg(COLORS[S.players[S.winner].c]);return renderWin()}
  setBg(COLORS[S.players[S.turn].c]);
  if(S.phase==="pass") return renderPass();
  renderTurn();
}

function nextFreeColor(skip){for(let k=1;k<=COLORS.length;k++){const c=(skip+k)%COLORS.length;if(!S.roster.some(r=>r.c===c))return c}return (skip+1)%COLORS.length}
function renderSetup(){
  const counts={g:GLOBAL.length,i:ISRAELI.length,m:GLOBAL.length+ISRAELI.length};
  app.innerHTML=`
  <div class="setupHero">
    <div class="heroTop"><div class="vinyls">${COLORS.slice(0,6).map(c=>`<i style="--c:${c}"></i>`).join("")}</div><button class="help" id="help" aria-label="How to play">?</button></div>
    <h1>Hit or Miss</h1>
    <p class="sub">Every song is a hit. Your guess might be a miss.</p>
  </div>
  <div class="section">
    <span class="eyebrow">Deck</span>
    <div class="seg" role="group" aria-label="Song deck">
      ${["g","i","m"].map(p=>`<button id="pack-${p}" aria-pressed="${S.pack===p}" data-pack="${p}">${PACK_LABEL[p]}<small>${counts[p]} songs</small></button>`).join("")}
    </div>
  </div>
  <div class="section grow">
    <span class="eyebrow">Players · tap a colour to change it</span>
    <div class="group scrolly">${S.roster.map((r,i)=>`<div class="nameRow">
      <button class="swatch" style="--c:${COLORS[r.c]}" data-col="${i}" aria-label="Change colour"></button>
      <input id="name-${i}" value="${esc(r.name)}" placeholder="Player ${i+1}" data-name="${i}" dir="auto" maxlength="14">
      <button class="iconBtn" aria-label="Remove player" data-del="${i}" ${S.roster.length<=2?"disabled":""}>×</button></div>`).join("")}
    ${S.roster.length<8?`<button class="addRow" id="addP">+ Add player</button>`:""}</div>
  </div>
  <div class="section">
    <span class="eyebrow">Game length</span>
    <div class="seg" role="group" aria-label="Game length">
      ${[[5,"Quick"],[10,"Classic"],[15,"Long"]].map(([n,l])=>`<button aria-pressed="${S.target===n}" data-target="${n}">${l}<small>${n} cards to win</small></button>`).join("")}
    </div>
  </div>
  <div class="bar">${cta("start","Start game","play")}</div>`;
  app.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>{S.pack=b.dataset.pack;save();render()});
  app.querySelectorAll("[data-name]").forEach(inp=>inp.oninput=()=>{S.roster[+inp.dataset.name].name=inp.value;save()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.roster.splice(+b.dataset.del,1);save();render()});
  app.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{const r=S.roster[+b.dataset.col];r.c=nextFreeColor(r.c);save();render()});
  $("addP")&&($("addP").onclick=()=>{S.roster.push({name:"",c:nextFreeColor(S.roster[S.roster.length-1].c)});save();render();const l=$("name-"+(S.roster.length-1));l&&l.focus()});
  app.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{S.target=+b.dataset.target;save();render()});
  $("start").onclick=startGame; $("help").onclick=openRules;
}

function renderPass(){
  const P=S.players[S.turn];
  app.innerHTML=`${boardHTML()}
  <div class="center">
    <div class="disc small"></div>
    <span class="eyebrow">Pass the phone to</span>
    <div class="bigName" dir="auto">${esc(P.name)}</div>
    <div class="stats"><span><b>${P.cards.length}</b> cards</span><span><i class="coin"></i><b>${P.tokens}</b> tokens</span><span><b>${S.target-P.cards.length}</b> to win</span></div>
  </div>
  <div class="bar">${cta("go","Start my turn","play",false,true)}</div>`;
  $("go").onclick=startTurn; $("help").onclick=openRules; wireQuit();
}

function renderTurn(){
  const P=S.players[S.turn], tl=P.cards;
  { const old=document.getElementById("tl"); if(old && tlKey===S.turn+":"+S.phase+":"+S.current) tlScroll=old.scrollTop; }
  let instr="", stage="", timeline="", bar="", tlTitle=`${esc(P.name)}'s timeline`;

  if(S.phase==="listen"){
    instr = !S.played ? "Press play and listen."
          : S.pick===null ? "When was it released? Tap a gap in your timeline."
          : "Happy with that spot? Lock it in, or tap another gap.";
    stage=`
    <div class="record glassy">
      <button class="playBtn" id="play" aria-label="Play song" disabled>${ICON_PLAY}</button>
      <span class="status" id="pstatus">Loading the song…</span>
    </div>
    <div class="fallback" id="fallback" hidden>
      <button class="btn soft small" id="freeSkip">Skip (free)</button>
      <a class="btn soft small" href="${spotifyURL(S.current)}" target="_blank" rel="noopener">Open Spotify</a>
    </div>
    <div class="tools">
      <button class="btn soft small" id="skip" ${P.tokens<1?"disabled":""}>Skip · <i class="coin"></i>1</button>
      <button class="btn soft small" id="buy" ${P.tokens<3?"disabled":""}>Buy card · <i class="coin"></i>3</button>
    </div>`;
    let h="";
    for(let k=tl.length;k>=0;k--){
      h += S.pick===k ? mysteryCardHTML("Your pick")
                      : `<button class="gap" data-gap="${k}"><span class="plus">+</span>${gapLabel(tl,k)}</button>`;
      if(k>0) h+=cardHTML(tl[k-1]);
    }
    timeline=h;
    bar= S.pick===null ? cta("lock","Pick a gap in your timeline","check",true)
                       : cta("lock",`Lock in · ${esc(gapLabel(tl,S.pick))}`,"check",false,true);
  }

  else if(S.phase==="steal"){
    const others=S.players.map((p,i)=>({p,i})).filter(o=>o.i!==S.turn);
    const openGaps=tl.length-S.challenges.length;
    instr = S.pickingFor!==null ? `${esc(S.players[S.pickingFor].name)}, tap the gap you think is right.`
          : `Think ${esc(P.name)} is wrong? Spend a token to steal.`;
    stage=`
      <div class="who">${others.map(({p,i})=>{const c=S.challenges.find(x=>x.p===i);const can=c||(p.tokens>0&&openGaps>0);
        return `<button data-st="${i}" aria-pressed="${!!c||S.pickingFor===i}" ${can?"":"disabled"} dir="auto"><span class="dot" style="background:${COLORS[p.c]}"></span>${esc(p.name)}${c?" ✓":""} · <i class="coin"></i>${p.tokens}</button>`}).join("")}</div>
      <p class="note">Tap your name, then a different gap. If ${esc(P.name)} misses and you're right, the card is yours. Tap again to cancel.</p>`;
    let h="";
    for(let k=tl.length;k>=0;k--){
      const c=S.challenges.find(x=>x.slot===k);
      if(S.pick===k) h+=mysteryCardHTML(P.name+"'s pick");
      else if(c) h+=tagHTML("wait",`${esc(S.players[c.p].name)}'s steal · ${gapLabel(tl,k)}`);
      else if(S.pickingFor!==null) h+=`<button class="gap" data-gap="${k}"><span class="plus">+</span>${gapLabel(tl,k)}</button>`;
      else h+=`<div class="gap quiet"></div>`;
      if(k>0) h+=cardHTML(tl[k-1]);
    }
    timeline=h;
    bar= S.pickingFor!==null ? cta("reveal","Pick a gap to steal","eye",true)
                             : cta("reveal",S.challenges.length?"Reveal the answer":"No steals · reveal","eye",false,true);
  }

  else {
    const r=S.result, s=song(S.current), wName=r.winner!==null?S.players[r.winner].name:null;
    let badge,head,line;
    if(r.bought){badge="ok";head="Card bought";line=`${esc(P.name)} traded 3 tokens for it.`}
    else if(r.okActive){badge="ok";head="Correct!";line=`It joins ${esc(P.name)}'s timeline.`}
    else if(wName){badge="st";head=`${esc(wName)} steals it`;line=`${esc(P.name)} missed this one.`}
    else {badge="no";head="Not quite";line="Nobody gets this card."}
    stage=`
      <div class="result">
        <div class="verdict"><span class="badge ${badge}">${badge==="no"?"✕":badge==="st"?"↯":"✓"}</span><div><b dir="auto">${head}</b><span dir="auto">${line}</span></div></div>
        <div class="song"><span class="y">${s.y}</span><div><div class="songT" dir="auto">${esc(s.t)}</div><div class="songA" dir="auto">${esc(s.a)}</div><a class="inlineLink" href="${spotifyURL(S.current)}" target="_blank" rel="noopener">Play full song ↗</a></div></div>
      </div>
      ${r.bought?"":`<div class="ask"><p dir="auto">Bonus: did ${esc(P.name)} name the song and the artist?</p>
        <div class="choice"><button id="nY" aria-pressed="${r.named===true}">Yes · +1 <i class="coin"></i></button><button id="nN" aria-pressed="${r.named===false}">No</button></div></div>`}
`;
    const before=r.before, y=s.y; let shown=false, h="";
    for(let k=before.length;k>=0;k--){
      const ok=slotOK(before,k,y);
      if(ok&&!shown){shown=true;h+=cardHTML(S.current,"placed")}
      if(S.pick===k&&!r.bought) h+=tagHTML(ok?"ok":"no",`${esc(P.name)}'s pick`);
      const c=S.challenges.find(x=>x.slot===k);
      if(c) h+=tagHTML(ok?"ok":"no",`${esc(S.players[c.p].name)}'s steal`);
      if(k>0) h+=cardHTML(before[k-1]);
    }
    timeline=h; tlTitle="Where it belongs";
    const last=S.players.some(p=>p.cards.length>=S.target);
    const need=!r.bought&&r.named===null;
    bar= need ? cta("next","Answer the bonus first","arrow",true)
              : cta("next",last?"See the winner":`Next: ${esc(S.players[(S.turn+1)%S.players.length].name)}`,"arrow",false,true);
  }

  app.innerHTML=`${boardHTML()}
    ${turnHeadHTML(P,instr)}
    ${stage}
    <div class="tlWrap"><div class="tlHead"><span class="eyebrow" dir="auto">${tlTitle}</span><span class="eyebrow">Newest on top · ${tl.length} card${tl.length===1?"":"s"}</span></div>
    <div class="timeline" id="tl">${timeline}</div></div>
    <div class="bar">${bar}</div>`;

  const tlEl=$("tl"), key=S.turn+":"+S.phase+":"+S.current;
  if(tlKey===key) tlEl.scrollTop=tlScroll;
  else { tlScroll=0; const pl=tlEl.querySelector(".card.placed"); if(pl) tlEl.scrollTop=Math.max(0,pl.offsetTop-60); }
  tlKey=key; tlEl.onscroll=()=>{tlScroll=tlEl.scrollTop};
  $("help").onclick=openRules; wireQuit();
  if($("play")){$("play").onclick=togglePlay; prepare(S.current); refreshPlay();}
  $("freeSkip")&&($("freeSkip").onclick=()=>newSong(0));
  $("skip")&&($("skip").onclick=()=>newSong(1));
  $("buy")&&($("buy").onclick=buyCard);
  $("lock")&&($("lock").onclick=lockIn);
  $("reveal")&&($("reveal").onclick=reveal);
  $("nY")&&($("nY").onclick=()=>{S.result.named=true;save();render()});
  $("nN")&&($("nN").onclick=()=>{S.result.named=false;save();render()});
  $("next")&&($("next").onclick=nextTurn);
  app.querySelectorAll("[data-gap]").forEach(b=>b.onclick=()=>tapGap(+b.dataset.gap));
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>toggleStealer(+b.dataset.st));
}

function renderWin(){
  const W=S.players[S.winner];
  app.innerHTML=`${boardHTML()}<div class="center">
    <div class="disc spin"></div>
    <span class="eyebrow">Winner</span>
    <div class="bigName" dir="auto">${esc(W.name)}</div>
    <p class="sub">${W.cards.length} songs in the timeline.</p></div>
    <div class="bar">${cta("again","Rematch","again",false,true)}<button class="linkish" id="setup">Change players or deck</button></div>`;
  $("help").onclick=openRules;
  $("again").onclick=()=>{S={...keep(),screen:"setup"};startGame()};
  $("setup").onclick=()=>{S={...keep(),screen:"setup"};save();render()};
}

function wireQuit(){
  const q=$("quit"); if(!q) return; let t=null;
  q.onclick=()=>{
    if(!q.classList.contains("armed")){q.classList.add("armed");q.textContent="End game?";t=setTimeout(()=>{q.classList.remove("armed");q.textContent="End"},3000);return}
    clearTimeout(t); stopAudio(); S={...keep(),screen:"setup"}; save(); render();
  };
}

function openRules(){
  sheet.innerHTML=`<div class="inner" role="dialog" aria-modal="true" aria-labelledby="rt">
    <h3 id="rt">How to play</h3>
    <ol>
      <li>Everyone starts with <b>one song card</b> showing its year. That's your timeline.</li>
      <li>On your turn, press <b>play</b>. The title stays hidden.</li>
      <li>Tap the gap where you think the song belongs, then <b>lock it in</b>.</li>
      <li>Others can <b>steal</b> by spending a token on a different gap.</li>
      <li>Right gap: the card is yours. Wrong: the first correct stealer takes it.</li>
      <li>First to <b>${S.target} cards</b> wins. A same-year neighbour counts as correct.</li>
    </ol>
    <div class="tokRules">
      <b><i class="coin"></i>Tokens</b>
      <span>Start with 2, hold up to 5.</span>
      <span>Earn 1 by naming the song and artist on your turn.</span>
      <span>Spend 1 to steal or skip a song, or 3 to buy the card without guessing.</span>
    </div>
    <button class="btn wide" id="closeRules">Got it</button></div>`;
  sheet.hidden=false;
  $("closeRules").onclick=()=>{sheet.hidden=true};
  sheet.onclick=e=>{if(e.target===sheet) sheet.hidden=true};
}

render();
</script>

</body>
</html>
